<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard</title>
  <meta name="description" content="Enterprise phishing detection platform featuring multi-engine email content analysis, sender address verification & spoofing inspection, website URL scanning, SHAP explainability charts, and Gmail inbox security.">
  <meta property="og:title" content="PhishGuard">
  <meta property="og:description" content="Enterprise phishing detection platform featuring multi-engine email content analysis, sender address verification & spoofing inspection, website URL scanning, SHAP explainability charts, and Gmail inbox security.">

  <!-- Tailwind CSS CDN matching original theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Identity Services (GIS) for Gmail OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root" class="min-h-full flex flex-col"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
